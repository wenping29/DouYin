<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="抖影 - 抖音风格竖屏短视频社区 MVP">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="抖影">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>抖影</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Flutter Web（CanvasKit）引擎会硬编码请求 fonts.gstatic.com 上的 Roboto /
    // Noto Sans SC 子集字体，国内或离线网络下必然失败并不断重试。
    // 这里拦截这些请求，统一回退到应用自带的 Noto Sans SC 完整字体（57k 字形，
    // 覆盖中英文），浏览器对同一 URL 只下载一次，彻底消除控制台报错。
    (function () {
      var LOCAL_FONT = 'assets/assets/fonts/notosanssc/NotoSansSC-6.ttf';
      var originalFetch = window.fetch;
      window.fetch = function (input, init) {
        try {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if (url.indexOf('fonts.gstatic.com') !== -1) {
            return originalFetch.call(this, LOCAL_FONT, init);
          }
        } catch (e) { /* 保持原始请求 */ }
        return originalFetch.apply(this, arguments);
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
