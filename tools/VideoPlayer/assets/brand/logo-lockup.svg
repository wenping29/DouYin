<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320" role="img" aria-label="VideoPlayer">
  <title>VideoPlayer — logo lockup</title>
  <defs>
    <linearGradient id="lk-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#1B202E"/>
      <stop offset="0.52" stop-color="#0D101A"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="lk-glow-cyan" cx="0.3" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lk-glow-violet" cx="0.76" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lk-play" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2BE7F5"/>
      <stop offset="0.55" stop-color="#6E5EFF"/>
      <stop offset="1" stop-color="#BA5CFF"/>
    </linearGradient>
    <filter id="lk-neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="lk-plate">
      <rect width="256" height="256" rx="53.5"/>
    </clipPath>
    <linearGradient id="lk-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2E4"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 32)">
    <g clip-path="url(#lk-plate)">
      <rect width="256" height="256" fill="url(#lk-bg)"/>
      <rect width="256" height="256" fill="url(#lk-glow-cyan)" style="mix-blend-mode:screen"/>
      <rect width="256" height="256" fill="url(#lk-glow-violet)" style="mix-blend-mode:screen"/>
    </g>
    <g transform="scale(0.25)">
      <path d="M 331 406 L 331 618 Q 331 718 417.91 668.54 L 606.09 561.46 Q 693 512 606.09 462.54 L 417.91 355.46 Q 331 306 331 406 Z" fill="url(#lk-play)" filter="url(#lk-neon)" opacity="0.5"/>
      <path d="M 331 406 L 331 618 Q 331 718 417.91 668.54 L 606.09 561.46 Q 693 512 606.09 462.54 L 417.91 355.46 Q 331 306 331 406 Z" fill="url(#lk-play)"/>
    </g>
    <rect x="1" y="1" width="254" height="254" rx="52.5"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  </g>

  <text x="316" y="172" fill="url(#lk-text)" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="86" font-weight="600" letter-spacing="-1.5">VideoPlayer</text>
  <text x="320" y="220" fill="#2BE7F5" font-family="Segoe UI Variable Text, Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="6.5" opacity="0.9">PLAY ANYTHING</text>
</svg>
